<p>Everything in one place. Add shapes, drag them around, move the sliders, then copy the tag.</p>
<div class="shapes">
  <button type="button" data-shape="dot big"><span>Circle</span></button>
  <button type="button" data-shape="square"><span>Square</span></button>
  <button type="button" data-shape="card"><span>Rectangle</span></button>
  <button type="button" data-shape="clear"><span>Clear</span></button>
</div>
<div class="playground" data-playground>
  <div class="stage" data-stage>
    <edinstvo-glass class="card" data-drag></edinstvo-glass>
  </div>
  <div class="controls"></div>
</div>
<h2>Your tag</h2>
<div class="code"><button class="copy" type="button">Copy</button><pre><code id="snippet"></code></pre></div>
